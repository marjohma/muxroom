# muxroom configuration.
# Copy to ~/.config/muxroom/config.toml (or pass --config / set MUXROOM_CONFIG).
# Without a config file muxroom manages only the local machine.

[server]
bind = "127.0.0.1"            # non-loopback addresses require --allow-remote-bind
port = 8765
state_dir = "~/.config/muxroom"  # holds the access token (mode 0600)
allow_host_editing = true     # "Add host" in the UI appends hosts to this file
# extra_origins = ["http://my-host.local:8765"]

# Agents that may be launched in new sessions. The UI only ever sends the key,
# never a command line. Commands are typed into the session's login shell, so
# PATH, nvm, conda etc. are loaded exactly as in a manual session.
[agents.claude]
label = "Claude Code"
command = ["claude"]

[agents.codex]
label = "Codex CLI"
command = ["codex"]

[agents.opencode]
label = "OpenCode"
command = ["opencode"]
# process_names = ["opencode"]  # how the agent appears in `ps` (default: command[0])

# Limits for file previews, downloads and uploads.
[files]
preview_max_mb = 50
download_max_mb = 2048
upload_max_mb = 512
list_max_entries = 5000

# --- Hosts -------------------------------------------------------------------

[[hosts]]
id = "local"                   # ^[a-z0-9][a-z0-9-]{0,31}$
label = "This machine"
transport = "local"
allowed_roots = ["~/projects"]          # new sessions may only start inside these
favorite_dirs = ["~/projects/my-study"]

[hosts.files]
read_roots = ["~/projects"]             # browse / preview / download (default: allowed_roots)
upload_roots = ["~/projects/incoming"]  # uploads (default: none)

# A remote host reached with the system OpenSSH client. Everything in your
# ~/.ssh/config applies: ProxyJump, ControlMaster, Kerberos, Match, Include, ...
[[hosts]]
id = "workstation"
label = "Lab workstation"
transport = "openssh"
ssh_host = "workstation"                 # alias from ~/.ssh/config
tmux_path = "/opt/homebrew/bin/tmux"     # needed when tmux is not on the non-interactive PATH
allowed_roots = ["~"]
agents = ["claude", "codex"]             # subset of [agents]; omit for all
connect_timeout = 10
command_timeout = 20
# ssh_options = ["ServerAliveInterval=30"]  # extra -o options
# ssh_config = "~/.ssh/muxroom_config"     # alternative ssh_config file (-F)
# tmux_socket = "muxroom"                 # use a separate tmux server (-L)

# A remote host via the pure-Python AsyncSSH client (key / ssh-agent auth only;
# no ControlMaster, no password prompts).
# [[hosts]]
# id = "cluster"
# transport = "asyncssh"
# ssh_host = "cluster.example.org"
