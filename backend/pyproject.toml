[project]
name = "muxroom"
version = "0.1.0"
description = "Local-first browser dashboard for persistent tmux sessions across machines"
license = "MIT"
authors = [{ name = "Markus Markl" }]
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.24.1,<2.25",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "tomlkit>=0.15.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
muxroom = "muxroom.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60
markers = [
    "integration: uses real local tmux / processes",
    "remote: needs MUXROOM_REMOTE_HOST and network access",
]
addopts = "-m 'not remote'"
filterwarnings = ["ignore:coroutine 'Queue.join' was never awaited:RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "S603", "S607", "ASYNC109"]  # explicit per-call timeouts are by design

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
